<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A browser request flows through a Lambda Function URL into a container-image Lambda running the agent, which calls Anthropic for reasoning, Bedrock to embed the query, and the CockroachDB Managed MCP Server for every structured and vector read/write. A separate dashed path shows the one exception: the ops-time seed script, which writes to CockroachDB directly, bypassing MCP.">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="390" y="20" width="220" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e293b">Browser</text>
  <text x="500" y="59" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">giacode17.github.io chat UI</text>

  <!-- Function URL (AWS) -->
  <rect x="390" y="112" width="220" height="46" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#7c2d12">Lambda Function URL</text>

  <!-- Lambda container (AWS) -->
  <rect x="180" y="196" width="640" height="88" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#7c2d12">AWS Lambda — container image</text>
  <text x="500" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">FastAPI + agent tool-use loop</text>
  <text x="500" y="269" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">(arm64, Mangum)</text>

  <!-- Anthropic -->
  <rect x="90" y="344" width="220" height="58" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="200" y="369" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e293b">Anthropic API</text>
  <text x="200" y="386" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Claude (reasoning)</text>

  <!-- Bedrock (AWS) -->
  <rect x="390" y="344" width="220" height="58" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="369" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#7c2d12">Amazon Bedrock</text>
  <text x="500" y="386" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">Titan Embed Text V2</text>

  <!-- MCP Server (CockroachDB) -->
  <rect x="690" y="344" width="220" height="58" rx="8" fill="#ecfdf9" stroke="#0f9d8c" stroke-width="1.5"/>
  <text x="800" y="369" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#134e4a">CockroachDB</text>
  <text x="800" y="386" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#134e4a">Managed MCP Server</text>

  <!-- CockroachDB Cloud cluster -->
  <rect x="560" y="462" width="340" height="76" rx="8" fill="#ecfdf9" stroke="#0f9d8c" stroke-width="1.5"/>
  <text x="730" y="488" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#134e4a">CockroachDB Cloud cluster</text>
  <text x="730" y="505" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#134e4a">structured tables + VECTOR(1024) index</text>
  <text x="730" y="521" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#134e4a">on plan_document_chunks</text>

  <!-- seed_data.py (ops, dashed path) -->
  <rect x="40" y="470" width="220" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="150" y="495" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">seed_data.py</text>
  <text x="150" y="512" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">ops, one-time</text>

  <!-- Arrows: main runtime path -->
  <line x1="500" y1="72" x2="500" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="514" y="95" font-family="sans-serif" font-size="10.5" fill="#475569">POST /chat, /renewal</text>

  <line x1="500" y1="158" x2="500" y2="194" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="514" y="180" font-family="sans-serif" font-size="10.5" fill="#475569">invoke</text>

  <line x1="290" y1="284" x2="205" y2="342" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="212" y="318" font-family="sans-serif" font-size="10.5" fill="#475569">tool-use loop</text>

  <line x1="500" y1="284" x2="500" y2="342" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="514" y="318" font-family="sans-serif" font-size="10.5" fill="#475569">embed query</text>

  <line x1="710" y1="284" x2="795" y2="342" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="716" y="318" font-family="sans-serif" font-size="10.5" fill="#475569">select_query / insert_rows</text>

  <line x1="800" y1="402" x2="800" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="814" y="435" font-family="sans-serif" font-size="10.5" fill="#475569">SQL</text>

  <!-- Arrow: ops-time dashed path, bypasses MCP -->
  <line x1="260" y1="500" x2="558" y2="500" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>
  <text x="330" y="493" font-family="sans-serif" font-size="10.5" fill="#64748b">direct SQL — bypasses MCP</text>

  <!-- Legend -->
  <rect x="40" y="20" width="14" height="14" rx="3" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="31" font-family="sans-serif" font-size="11" fill="#334155">AWS</text>
  <rect x="40" y="42" width="14" height="14" rx="3" fill="#ecfdf9" stroke="#0f9d8c" stroke-width="1.5"/>
  <text x="60" y="53" font-family="sans-serif" font-size="11" fill="#334155">CockroachDB</text>
</svg>
